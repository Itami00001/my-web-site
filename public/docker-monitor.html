<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Monitor - Pick a Drive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 i {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .containers-grid {
            display: grid;
            gap: 20px;
        }

        .container-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .container-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        }

        .container-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.1);
        }

        .container-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
        }

        .status-badge {
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .status-badge.running {
            background: #dcfce7;
            color: #166534;
        }

        .status-badge.exited {
            background: #fecaca;
            color: #dc2626;
        }

        .container-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-item label {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-item value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0f172a;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #e2e8f0;
            border-radius: 50px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-restart {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-logs {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 1.8rem;
            color: #0f172a;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #64748b;
        }

        .logs-content {
            background: #0f172a;
            color: #10b981;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
            color: white;
        }

        .error {
            background: #fecaca;
            color: #dc2626;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fab fa-docker"></i> Docker Monitoring Dashboard</h1>
            <button class="refresh-btn" onclick="loadData()">
                <i class="fas fa-sync"></i>
                Обновить
            </button>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>Total Containers</h3>
                <div class="value" id="totalContainers">-</div>
            </div>
            <div class="stat-card">
                <h3>Running</h3>
                <div class="value" id="runningContainers">-</div>
            </div>
            <div class="stat-card">
                <h3>Stopped</h3>
                <div class="value" id="stoppedContainers">-</div>
            </div>
            <div class="stat-card">
                <h3>Images</h3>
                <div class="value" id="totalImages">-</div>
            </div>
        </div>

        <div class="containers-grid" id="containersGrid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> Загрузка данных...
            </div>
        </div>
    </div>

    <div class="modal" id="logsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Container Logs</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="logs-content" id="logsContent"></div>
        </div>
    </div>

    <script>
        let autoRefreshInterval;

        async function loadData() {
            try {
                // Load system info
                const infoResponse = await fetch('/api/docker/info');
                const info = await infoResponse.json();

                document.getElementById('totalContainers').textContent = info.containers || 0;
                document.getElementById('runningContainers').textContent = info.containersRunning || 0;
                document.getElementById('stoppedContainers').textContent = info.containersStopped || 0;
                document.getElementById('totalImages').textContent = info.images || 0;

                // Load containers
                const containersResponse = await fetch('/api/docker/containers');
                const containers = await containersResponse.json();

                displayContainers(containers);
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('containersGrid').innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i>
                        Ошибка загрузки: ${error.message}
                    </div>
                `;
            }
        }

        function displayContainers(containers) {
            const grid = document.getElementById('containersGrid');

            if (containers.length === 0) {
                grid.innerHTML = '<div class="loading">Нет запущенных контейнеров</div>';
                return;
            }

            grid.innerHTML = containers.map(container => `
                <div class="container-card">
                    <div class="container-header">
                        <div class="container-name">${container.name}</div>
                        <div class="status-badge ${container.state.toLowerCase()}">${container.state}</div>
                    </div>
                    
                    <div class="container-info">
                        <div class="info-item">
                            <label>Image</label>
                            <value>${container.image}</value>
                        </div>
                        <div class="info-item">
                            <label>Container ID</label>
                            <value>${container.id}</value>
                        </div>
                        <div class="info-item">
                            <label>Status</label>
                            <value>${container.status}</value>
                        </div>
                    </div>

                    <div class="info-item">
                        <label>CPU Usage: ${container.stats.cpu}%</label>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.min(container.stats.cpu, 100)}%">
                                ${container.stats.cpu}%
                            </div>
                        </div>
                    </div>

                    <div class="info-item" style="margin-top: 15px;">
                        <label>Memory: ${container.stats.memory.used} / ${container.stats.memory.limit} (${container.stats.memory.percent}%)</label>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.min(container.stats.memory.percent, 100)}%">
                                ${container.stats.memory.percent}%
                            </div>
                        </div>
                    </div>

                    <div class="info-item" style="margin-top: 15px;">
                        <label>Network</label>
                        <value>RX: ${container.stats.network.rx} | TX: ${container.stats.network.tx}</value>
                    </div>

                    <div class="actions">
                        ${container.state === 'running' ? `
                            <button class="btn btn-restart" onclick="restartContainer('${container.id}', '${container.name}')">
                                <i class="fas fa-redo"></i>
                                Restart
                            </button>
                        ` : ''}
                        <button class="btn btn-logs" onclick="viewLogs('${container.id}', '${container.name}')">
                            <i class="fas fa-file-alt"></i>
                            View Logs
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function restartContainer(id, name) {
            if (!confirm(`Перезапустить контейнер "${name}"?`)) return;

            try {
                const response = await fetch(`/api/docker/restart/${id}`, {
                    method: 'POST'
                });
                const result = await response.json();
                alert(result.message || 'Container restarted!');
                loadData();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function viewLogs(id, name) {
            try {
                document.getElementById('modalTitle').textContent = `Logs: ${name}`;
                document.getElementById('logsContent').textContent = 'Загрузка логов...';
                document.getElementById('logsModal').classList.add('active');

                const response = await fetch(`/api/docker/logs/${id}`);
                const result = await response.json();
                document.getElementById('logsContent').textContent = result.logs || 'No logs available';
            } catch (error) {
                document.getElementById('logsContent').textContent = 'Error loading logs: ' + error.message;
            }
        }

        function closeModal() {
            document.getElementById('logsModal').classList.remove('active');
        }

        // Auto-refresh every 5 seconds
        function startAutoRefresh() {
            loadData();
            autoRefreshInterval = setInterval(loadData, 5000);
        }

        // Initial load
        startAutoRefresh();

        // Stop auto-refresh when page is hidden
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(autoRefreshInterval);
            } else {
                startAutoRefresh();
            }
        });
    </script>
</body>

</html>
